<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Essential Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />

  <!-- iOS Specific -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="App Name" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    href="/splash/launch-1125x2436.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    href="/splash/launch-1170x2532.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    href="/img/splash-750x1334.png" />

  <!-- Android Specific -->
  <meta name="msapplication-TileColor" content="#ffffff" />


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ejs@3.1.10/ejs.min.js"></script>
  <script src="./js/main.js" type="module"></script>
  <style>
    .logo {
      width: 60px;
      height: 60px;
      margin: 40px auto 20px;
      border: 2px solid #00c851;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #00c851;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .social-icons img {
      width: 36px;
      height: 36px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #00c851;
      font-weight: bold;
      text-decoration: none;
    }

    ion-item[x-currently] {
      margin: 15px 0 15px 0;
    }

    .ion-page {
      display: initial
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    ion-card-title {
      font-size: 1.25rem;
    }

    ion-thumbnail {
      --size: 140px;
    }

    ion-footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 999;
    }

    ion-content::part(scroll) {
      padding-bottom: 100px;
      /* Adjust this value to match your footer's height */
    }
  </style>

  <style>
    ion-segment-view {
      height: 150px;
    }

    ion-segment-content {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    ion-segment-content:nth-of-type(1) {
      background: lightpink;
    }

    ion-segment-content:nth-of-type(2) {
      background: lightblue;
    }

    ion-segment-content:nth-of-type(3) {
      background: lightgreen;
    }
  </style>

  <style>
    .search-item {
      opacity: 0;
      transform: translateX(20px);
      animation: slideIn 300ms ease forwards;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>

  <title>Mobile App</title>
</head>

<body>

  <ion-app>
    <ion-router use-hash="true">
      <ion-route url="/" component="home-page"></ion-route>
      <ion-route url="/wines/:id" component="wine-detail-page"></ion-route>
    </ion-router>
    <ion-router-outlet animated="true">
    </ion-router-outlet>

  </ion-app>

  <script type="module">

    class UISearchResults extends HTMLElement {
      connectedCallback() {
        this.renderEmptyState();

        // optional: signal ready
        setTimeout(() => {
          document.dispatchEvent(
            new CustomEvent('SEARCH_RESULTS_INITIALIZED')
          );
        }, 0);
      }

      /**
       * @param {Result<Object[]>} data
       */
      onComponentUpdate(data) {
        try {
          console.log(data)
          if (data.isError()) {
            this.renderEmptyState();
            return;
          }

          this.innerHTML = `
                <ion-list>
                ${data.getValue()
              .map(
                (item, index) => `
                <ion-router-link href="/wines/${item.id}" router-direction="forward">
                        <ion-item 
                        button 
                        detail="true" 
                        class="search-item"
                        style="animation-delay: ${index * 60}ms"
                        
                        >
                        <ion-label>
                            <h3>${item.name}</h3>
                            <p>${item.producer_id}</p>
                        </ion-label>
                        </ion-item>
                </ion-router-link>
                    `
              )
              .join('')}
                </ion-list>
            `;
        } catch (ex) {
          console.error(
            `INTERNAL_ERROR (UISearchResults): **EXCEPTION ENCOUNTED** while rendering component update. See details -> ${ex.message}`
          );
          this.renderErrorState();
        }
      }

      renderEmptyState() {
        this.innerHTML = `
            <div class="empty-state">
                <ion-text color="medium">
                <p style="text-align:center; margin-top: 40px;">
                    Nothing to see here. Start a search to see results.
                </p>
                </ion-text>
            </div>
            `;
      }

      renderLoadingState() {
        this.innerHTML = `
            <ion-list>
                ${Array(5)
            .fill(0)
            .map(
              () => `
                    <ion-item>
                    <ion-label>
                        <h3><ion-skeleton-text animated style="width: 70%"></ion-skeleton-text></h3>
                        <p><ion-skeleton-text animated style="width: 40%"></ion-skeleton-text></p>
                    </ion-label>
                    </ion-item>
                `
            )
            .join('')}
            </ion-list>
            `;
      }

      renderErrorState() {
        this.innerHTML = `
            <ion-text color="danger">
                <p style="text-align:center; margin-top: 40px;">
                Something went wrong. Try again later.
                </p>
            </ion-text>
            `;
      }
    }
    class HomePage extends HTMLElement {
      connectedCallback() {
        this.innerHTML = `
      <ion-page>
       <!--HEADER-->
    <ion-header>

      <ion-toolbar>
        <ion-segment>
          <ion-segment-button value="product_lookup" content-id="search">
            <ion-label>Search</ion-label>
          </ion-segment-button>
          <ion-segment-button value="product_discovery" content-id="discover">
            <ion-label>Discover</ion-label>
          </ion-segment-button>
        </ion-segment>
      </ion-toolbar>

      <ion-searchbar placeholder="e.g. Tomaiolo Chianti Classico" debounce="1000"></ion-searchbar>

    </ion-header>


    <!-- SIDE NAVIGATION -->
    <ion-menu content-id="home-page">
      <ion-header>
        <ion-toolbar>
          <ion-title></ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-list>
          <ion-item>
            <ion-label>Account</ion-label>
          </ion-item>
          <ion-item>
            <ion-label>Settings</ion-label>
          </ion-item>
          <ion-item>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>

        <div class="ion-page" id="home-page">
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-menu-button></ion-menu-button>
              </ion-buttons>
              <ion-title>Vine.ly</ion-title>
            </ion-toolbar>
          </ion-header>


          <ion-segment-view>
            <ion-segment-content id="search">
              Find wines by label or producer name
            </ion-segment-content>
            <ion-segment-content id="discover">
              Explore wines by attribtutes
            </ion-segment-content>
          </ion-segment-view>

          <ion-content class="ion-padding" id="main-content">
            <ui-search-results></ui-search-results> 
          </ion-content>
        </div>    
      </ion-page>
    `;
      }
    }


    class WineDetailPage extends HTMLElement {
      connectedCallback() {
        this.innerHTML = `
      <ion-page>
        <ion-content>
          <h1>Detail Page</h1>
        </ion-content>
      </ion-page>
    `;
      }
    }



    customElements.define('ui-search-results', UISearchResults);
    customElements.define('home-page', HomePage);
    customElements.define('wine-detail-page', WineDetailPage);

  </script>
</body>

</html>
