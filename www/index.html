<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Essential Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />

  <!-- iOS Specific -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="App Name" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    href="/splash/launch-1125x2436.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    href="/splash/launch-1170x2532.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    href="/img/splash-750x1334.png" />

  <!-- Android Specific -->
  <meta name="msapplication-TileColor" content="#ffffff" />


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ejs@3.1.10/ejs.min.js"></script>
  <script src="./js/main.js" type="module"></script>
  <style>
    .logo {
      width: 60px;
      height: 60px;
      margin: 40px auto 20px;
      border: 2px solid #00c851;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #00c851;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .social-icons img {
      width: 36px;
      height: 36px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #00c851;
      font-weight: bold;
      text-decoration: none;
    }

    ion-item[x-currently] {
      margin: 15px 0 15px 0;
    }

    .ion-page {
      display: initial
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    ion-card-title {
      font-size: 1.25rem;
    }

    ion-thumbnail {
      --size: 140px;
    }

    ion-footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 999;
    }

    ion-content::part(scroll) {
      padding-bottom: 100px;
      /* Adjust this value to match your footer's height */
    }
  </style>

  <style>
    ion-segment-view {
      height: 150px;
    }

    ion-segment-content {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    ion-segment-content:nth-of-type(1) {
      background: lightpink;
    }

    ion-segment-content:nth-of-type(2) {
      background: lightblue;
    }

    ion-segment-content:nth-of-type(3) {
      background: lightgreen;
    }
  </style>

  <style>
    .search-item {
      opacity: 0;
      transform: translateX(20px);
      animation: slideIn 300ms ease forwards;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>

  <title>Mobile App</title>
</head>

<body>

  <ion-app>



    <!--HEADER-->
    <ion-header>

      <ion-toolbar>
        <ion-segment>
          <ion-segment-button value="product_lookup" content-id="search">
            <ion-label>Search</ion-label>
          </ion-segment-button>
          <ion-segment-button value="product_discovery" content-id="discover">
            <ion-label>Discover</ion-label>
          </ion-segment-button>
        </ion-segment>
      </ion-toolbar>

      <ion-searchbar placeholder="e.g. Tomaiolo Chianti Classico" debounce="1000"></ion-searchbar>

    </ion-header>


    <!-- SIDE NAVIGATION -->
    <ion-menu content-id="home-page">
      <ion-header>
        <ion-toolbar>
          <ion-title></ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-list>
          <ion-item>
            <ion-label>Account</ion-label>
          </ion-item>
          <ion-item>
            <ion-label>Settings</ion-label>
          </ion-item>
          <ion-item>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-tabs>
      <ion-tab tab="home">
        <div class="ion-page" id="home-page">
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-menu-button></ion-menu-button>
              </ion-buttons>
              <ion-title>Vine.ly</ion-title>
            </ion-toolbar>
          </ion-header>


          <ion-segment-view>
            <ion-segment-content id="search">
              Find wines by label or producer name
            </ion-segment-content>
            <ion-segment-content id="discover">
              Explore wines by attribtutes
            </ion-segment-content>
          </ion-segment-view>

          <ion-content class="ion-padding" id="main-content">

            <ui-search-results></ui-search-results>
          </ion-content>
        </div>
      </ion-tab>
      <ion-tab tab="radio">
        <div id="radio-page">
          <ion-header>
            <ion-toolbar>
              <ion-title>Trends</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content>
            <div class="example-content">Trends content</div>
          </ion-content>
        </div>
      </ion-tab>

      <!--<ion-tab-bar slot="bottom">
        <ion-tab-button tab="search">
          <ion-icon name="search"></ion-icon>
          Search
        </ion-tab-button>
      </ion-tab-bar>-->
    </ion-tabs>

    <!--<ion-footer>
        <ion-toolbar>
          <ion-title>Footer</ion-title>
        </ion-toolbar>
      </ion-footer>-->
    <!--<ion-nav></ion-nav>-->
  </ion-app>

  <script type="module">
    class SearchPage extends HTMLElement {
      connectedCallback() {
        this.innerHTML = `
      <ion-page>
        <ion-content>
          <h1>Search Page</h1>
        </ion-content>
      </ion-page>
    `;
      }
    }
    customElements.define('search-page', SearchPage);


    class WineDetailPage extends HTMLElement {
      connectedCallback() {
        this.innerHTML = `
      <ion-page>
        <ion-content>
          <h1>Detail Page</h1>
        </ion-content>
      </ion-page>
    `;
      }
    }
    customElements.define('wine-detail-page', WineDetailPage);

  </script>
</body>

</html>
